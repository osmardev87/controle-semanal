services:
  controle-semanal:
    build: .
    container_name: controle-semanal
    ports:
      - "8080:8080"
    volumes:
      - controle-semanal-data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M       # ✅ 650M → 400M (-250 MB!)
        reservations:
          memory: 320M       # ✅ Adicionado: reserva só o essencial

volumes:
  controle-semanal-data: