services:
  controle-semanal:
    build: .
    container_name: controle-semanal
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:?Defina DB_URL no ambiente}
      DB_USERNAME: ${DB_USERNAME:?Defina DB_USERNAME no ambiente}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.8'
        reservations:
          memory: 320M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3