<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Administração privada | Meu Bolso</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--card:#111c2e;--line:#263750;--text:#e7edf7;--muted:#a8b6ca;--accent:#58d6a5;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#172a41,var(--bg) 60%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(100%,520px);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 24px 80px #0006}h1{font-size:1.5rem;margin:0 0 8px}.hint{color:var(--muted);line-height:1.55;margin:0 0 22px}label{display:block;font-weight:600;margin:16px 0 7px}input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:#0b1423;color:var(--text);font:inherit}input:focus{outline:2px solid var(--accent);border-color:transparent}button{width:100%;margin-top:20px;border:0;border-radius:10px;padding:13px;background:var(--accent);color:#062016;font:700 1rem inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{min-height:24px;margin-top:16px;line-height:1.5}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.lock{font-size:2rem;margin-bottom:8px}.small{font-size:.85rem;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<main class="card">
<div class="lock" aria-hidden="true">🔐</div>
<h1>Administração de acesso</h1>
<p class="hint">Defina uma senha temporária para uma conta. A pessoa precisará criar uma senha pessoal no próximo acesso.</p>
<form id="form">
<label for="adminToken">Token administrativo</label>
<input id="adminToken" type="password" autocomplete="off" required>
<label for="telephone">Telefone da conta</label>
<input id="telephone" type="tel" inputmode="tel" autocomplete="off" placeholder="75988477936" maxlength="20" required>
<label for="temporaryPassword">Senha temporária</label>
<input id="temporaryPassword" type="password" autocomplete="new-password" minlength="6" maxlength="72" required>
<button id="submit" type="submit">Definir senha temporária</button>
<div id="status" class="status" role="status" aria-live="polite"></div>
</form>
<p class="small">Use somente em conexão HTTPS fora do ambiente local. O token não é salvo neste navegador.</p>
</main>
<script>
const form=document.getElementById('form');
const statusBox=document.getElementById('status');
const submitButton=document.getElementById('submit');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  const token=document.getElementById('adminToken').value;
  const telephone=document.getElementById('telephone').value.trim();
  const password=document.getElementById('temporaryPassword').value;
  statusBox.textContent='';statusBox.className='status';submitButton.disabled=true;
  try{
    const response=await fetch('/api/users/admin/'+encodeURIComponent(telephone)+'/temporary-password',{
      method:'POST',headers:{'Content-Type':'application/json','X-Password-Admin-Token':token},
      body:JSON.stringify({password})
    });
    if(response.status===204){statusBox.textContent='Senha temporária definida. Entregue-a à pessoa por um canal seguro.';statusBox.classList.add('success');document.getElementById('temporaryPassword').value='';return;}
    let message='Não foi possível definir a senha.';
    try{const data=await response.json();message=data.message||data.error||message;}catch{}
    if(response.status===401)message='Token administrativo incorreto.';
    if(response.status===503)message='Configure PASSWORD_ADMIN_TOKEN no servidor e reinicie a aplicação.';
    statusBox.textContent=message;statusBox.classList.add('error');
  }catch(error){statusBox.textContent='Falha de conexão com o servidor.';statusBox.classList.add('error');}
  finally{submitButton.disabled=false;}
});
</script>
</body>
</html>
