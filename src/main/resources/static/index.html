<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Semanal - Finance Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- Chart.js for interactive analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col">

<header class="bg-cardbg border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500/10 text-emerald-400 p-2 rounded-xl">
                <i class="fa-solid fa-wallet text-xl"></i>
            </div>
            <h1 class="text-lg font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">
                Controle Semanal Finance
            </h1>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl font-medium text-sm transition shadow-lg shadow-emerald-900/20 flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Novo Lançamento
            </button>
        </div>
    </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Filters & Week Selection -->
    <div class="bg-cardbg rounded-2xl p-6 border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
        <div>
            <h2 class="text-xl font-semibold text-slate-200">Resumo da Semana</h2>
            <p class="text-sm text-slate-400" id="weekRangeLabel">Carregando período da semana...</p>
        </div>
        <div class="flex items-center gap-3 w-full md:w-auto">
            <label for="weekDatePicker" class="text-sm text-slate-400 whitespace-nowrap"><i class="fa-regular fa-calendar"></i> Data Base:</label>
            <input type="date" id="weekDatePicker" onchange="onDateChange()" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 w-full md:w-auto">
        </div>
    </div>

    <!-- Metric Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Entradas -->
        <div class="bg-cardbg rounded-2xl p-6 border border-slate-800 relative overflow-hidden">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-400">Entradas (Semana)</p>
                    <h3 class="text-2xl font-bold text-emerald-400 mt-1" id="totalIncome">R$ 0,00</h3>
                </div>
                <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl">
                    <i class="fa-solid fa-arrow-trend-up text-xl"></i>
                </div>
            </div>
        </div>
        <!-- Saídas -->
        <div class="bg-cardbg rounded-2xl p-6 border border-slate-800 relative overflow-hidden">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-400">Saídas (Semana)</p>
                    <h3 class="text-2xl font-bold text-rose-400 mt-1" id="totalExpense">R$ 0,00</h3>
                </div>
                <div class="p-3 bg-rose-500/10 text-rose-400 rounded-xl">
                    <i class="fa-solid fa-arrow-trend-down text-xl"></i>
                </div>
            </div>
        </div>
        <!-- Saldo -->
        <div class="bg-cardbg rounded-2xl p-6 border border-slate-800 relative overflow-hidden">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-400">Balanço Semanal</p>
                    <h3 class="text-2xl font-bold text-sky-400 mt-1" id="totalBalance">R$ 0,00</h3>
                </div>
                <div class="p-3 bg-sky-500/10 text-sky-400 rounded-xl">
                    <i class="fa-solid fa-scale-balanced text-xl"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts Section -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Categories breakdown -->
       
        <!-- Transactions Table -->
        <div class="bg-cardbg rounded-2xl p-6 border border-slate-800 lg:col-span-3 flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-semibold text-slate-200">Lançamentos da Semana</h3>
                <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full" id="txCount">0 registros</span>
            </div>
            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase tracking-wider">
                        <th class="pb-3 font-semibold">Descrição</th>
                        <th class="pb-3 font-semibold">Categoria</th>
                        <th class="pb-3 font-semibold">Data</th>
                        <th class="pb-3 font-semibold">Pagamento</th>
                        <th class="pb-3 font-semibold text-right">Valor</th>
                    </tr>
                    </thead>
                    <tbody id="transactionTableBody" class="divide-y divide-slate-800/50 text-sm">
                    <!-- Injected rows via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div id="transactionModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-cardbg border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-slate-100">Novo Lançamento (Finace)</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-100"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form id="transactionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Descrição</label>
                <input type="text" id="formDescription" required placeholder="Ex: Supermercado" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" id="formPrice" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Data</label>
                    <input type="date" id="formDate" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Tipo</label>
                    <select id="formType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="SAIDA">Gasto (Saída)</option>
                        <option value="ENTRADA">Receita (Entrada)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Categoria</label>
                    <select id="formCategory" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="">Selecione uma categoria</option>

                        <option value="ALIMENTACAO">Alimentação</option>
                        <option value="TRANSPORTE">Transporte</option>
                        <option value="MORADIA">Moradia</option>
                        <option value="SAUDE">Saúde</option>
                        <option value="EDUCACAO">Educação</option>
                        <option value="LAZER">Lazer</option>
                        <option value="COMPRAS">Compras</option>
                        <option value="SALARIO">Salário</option>
                        <option value="OUTROS">Outros</option>
                    </select>

                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Forma de Pagamento</label>
                <select id="formPayment"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">

                    <option value="">Selecione o pagamento</option>

                    <option value="PIX">Pix</option>
                    <option value="DINHEIRO">Dinheiro</option>
                    <option value="DEBITO">Cartão de Débito</option>
                    <option value="CREDITO">Cartão de Crédito</option>
                    <option value="BOLETO">Boleto</option>
                    <option value="TRANSFERENCIA">Transferência</option>
                    <option value="OUTROS">Outros</option>

                </select>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Cancelar</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition">Salvar Lançamento</button>
            </div>
        </form>
    </div>
</div>

<!-- Notification Toast -->
<div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMessage" class="text-sm font-medium">Operação realizada com sucesso!</span>
</div>

<script>
    // Aligned with your @RestController @RequestMapping("/finace")
    const API_BASE_URL = 'https://controler.gomesdev87.tech/finace';

    let transactions = [];
    let categoryChartInstance = null;
    let isOfflineMode = false;

    // Mock data for offline/preview testing when backend is not running
    const mockTransactions = [
        { id: 1, description: 'Salário Mensal', price: 5000.00, date: '2026-09-15', type: 'ENTRADA', category: 'SALARIO', payment: 'TRANSFERENCIA' },
        { id: 2, description: 'Supermercado Mensal', price: 650.50, date: '2026-09-15', type: 'SAIDA', category: 'ALIMENTACAO', payment: 'PIX' },
        { id: 3, description: 'Combustível Posto', price: 200.00, date: '2026-09-14', type: 'SAIDA', category: 'TRANSPORTE', payment: 'CREDITO' },
        { id: 4, description: 'Conta de Internet', price: 120.00, date: '2026-09-13', type: 'SAIDA', category: 'MORADIA', payment: 'BOLETO' }
    ];

    window.onload = function() {
        // Set date picker to today
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('weekDatePicker').value = todayStr;
        document.getElementById('formDate').value = todayStr;

        refreshDashboard();
    }

    window.onDateChange = function() {
        refreshDashboard();
    }

    async function refreshDashboard() {
        const selectedDateVal = document.getElementById('weekDatePicker').value;
        if (!selectedDateVal) return;

        try {
            // Calls your FinaceController: @GetMapping("/semana/{date}")
            const response = await fetch(`${API_BASE_URL}/semana/${selectedDateVal}`);
            if (!response.ok) {
                throw new Error('Falha ao carregar os dados da semana do servidor.');
            }
            transactions = await response.json();
            isOfflineMode = false;
        } catch (error) {
            console.warn('Backend não acessível, ativando modo demonstração local:', error);
            isOfflineMode = true;
            // Fallback to mock data filtered roughly by date or show all in mock mode
            transactions = mockTransactions;
            showToast('Modo Offline/Demonstração Ativado (Backend não conectado)', 'error');
        }

        // Compute local dates for UI display banner based on input
        const { start, end } = getWeekInterval(selectedDateVal);
        const startStr = start.toLocaleDateString('pt-BR');
        const endStr = end.toLocaleDateString('pt-BR');
        document.getElementById('weekRangeLabel').innerText = `Semana de ${startStr} até ${endStr} ${isOfflineMode ? '(Demonstração)' : ''}`;

        let totalIncome = 0;
        let totalExpense = 0;
        const categoryMap = {};

        transactions.forEach(tx => {
            if (tx.type === 'ENTRADA') {
                totalIncome += tx.price;
            } else {
                totalExpense += tx.price;
                categoryMap[tx.category] = (categoryMap[tx.category] || 0) + tx.price;
            }
        });

        const balance = totalIncome - totalExpense;

        // Render Metrics
        document.getElementById('totalIncome').innerText = formatCurrency(totalIncome);
        document.getElementById('totalExpense').innerText = formatCurrency(totalExpense);

        const balanceEl = document.getElementById('totalBalance');
        balanceEl.innerText = formatCurrency(balance);
        balanceEl.className = `text-2xl font-bold mt-1 ${balance >= 0 ? 'text-sky-400' : 'text-rose-400'}`;

        document.getElementById('txCount').innerText = `${transactions.length} registros`;

        renderTable(transactions);
        renderCategoryChart(categoryMap);
    }

    function getWeekInterval(dateString) {
        const date = new Date(dateString + 'T00:00:00');
        const day = date.getDay();
        const diffToMonday = date.getDate() - day + (day === 0 ? -6 : 1);

        const monday = new Date(date.setDate(diffToMonday));
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        return { start: monday, end: sunday };
    }

    function renderTable(txList) {
        const tbody = document.getElementById('transactionTableBody');
        tbody.innerHTML = '';

        if (!txList || txList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500">Nenhum lançamento encontrado para esta semana.</td></tr>`;
            return;
        }

        txList.forEach(tx => {
            const isIncome = tx.type === 'INCOME';
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-800/40 transition';
            tr.innerHTML = `
                    <td class="py-3.5 font-medium text-slate-200">${escapeHtml(tx.description)}</td>
                    <td class="py-3.5 text-slate-400"><span class="bg-slate-800 px-2.5 py-1 rounded-lg text-xs">${escapeHtml(tx.category)}</span></td>
                    <td class="py-3.5 text-slate-400">${formatDate(tx.date)}</td>
                    <td class="py-3.5 text-slate-400 text-xs">${escapeHtml(tx.payment)}</td>
                    <td class="py-3.5 text-right font-semibold ${isIncome ? 'text-emerald-400' : 'text-slate-100'}">
                        ${isIncome ? '+' : '-'} ${formatCurrency(tx.price)}
                    </td>
                `;
            tbody.appendChild(tr);
        });
    }

    function renderCategoryChart(categoryMap) {
        const ctx = document.getElementById('categoryChart').getContext('2d');
        const labels = Object.keys(categoryMap);
        const data = Object.values(categoryMap);

        if (categoryChartInstance) {
            categoryChartInstance.destroy();
        }

        if (labels.length === 0) {
            return;
        }

        categoryChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: ['#10b981', '#38bdf8', '#f43f5e', '#fbbf24', '#a855f7', '#6366f1'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#94a3b8',
                            font: { family: 'Inter', size: 11 }
                        }
                    }
                }
            }
        });
    }

    window.openModal = function() {
        document.getElementById('transactionModal').classList.remove('hidden');
    }

    window.closeModal = function() {
        document.getElementById('transactionModal').classList.add('hidden');
    }

    window.handleFormSubmit = async function(e) {
        e.preventDefault();

        // Matches FinaceRequestDTO properties
        const requestDTO = {
            description: document.getElementById('formDescription').value,
            price: parseFloat(document.getElementById('formPrice').value),
            date: document.getElementById('formDate').value,
            type: document.getElementById('formType').value,
            category: document.getElementById('formCategory').value,
            payment: document.getElementById('formPayment').value
        };

        if (isOfflineMode) {
            // Simulate saving locally in mock mode
            mockTransactions.unshift({
                id: Date.now(),
                ...requestDTO
            });
            closeModal();
            document.getElementById('transactionForm').reset();
            document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
            refreshDashboard();
            showToast('Lançamento salvo localmente (Modo Demo)');
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestDTO)
            });

            if (!response.ok) {
                throw new Error('Erro ao salvar lançamento no servidor.');
            }

            closeModal();
            document.getElementById('transactionForm').reset();
            document.getElementById('formDate').value = new Date().toISOString().split('T')[0];

            refreshDashboard();
            showToast('Lançamento criado com sucesso!');
        } catch (error) {
            console.error(error);
            showToast('Erro ao comunicar com o servidor Spring Boot', 'error');
        }
    }

    function formatCurrency(val) {
        return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const messageEl = document.getElementById('toastMessage');
        messageEl.innerText = msg;

        toast.className = `fixed bottom-5 right-5 text-white px-5 py-3 rounded-xl shadow-xl transform transition-all duration-300 flex items-center gap-3 z-50 ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;

        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0');
        }, 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.toString().replace(/[&<>'"]/g,
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>
</body>
</html>
