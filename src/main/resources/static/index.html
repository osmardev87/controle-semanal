<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Semanal</title>
    <!-- Tailwind CSS para um design moderno e limpo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between">
        <div>
            <!-- Cabeçalho -->
            <header class="bg-indigo-600 text-white p-4 rounded-xl shadow-md mb-4 text-center">
                <h1 class="text-xl font-bold">Controle Semanal 📊</h1>
                <p class="text-xs text-indigo-200">Gerenciador de Gastos Pessoais</p>
            </header>

            <!-- Formulário de Cadastro -->
            <div class="bg-white p-4 rounded-xl shadow-md mb-4">
                <h2 class="text-md font-semibold text-gray-700 mb-3">Adicionar Gasto</h2>
                <form id="gastoForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600">Descrição</label>
                        <input type="text" id="descricao" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">Valor (R$)</label>
                        <input type="number" step="0.01" id="valor" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">Data</label>
                        <input type="date" id="data" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">Salvar Gasto</button>
                </form>
            </div>

            <!-- Lista de Gastos -->
            <div class="bg-white p-4 rounded-xl shadow-md">
                <h2 class="text-md font-semibold text-gray-700 mb-3">Gastos Registrados</h2>
                <div id="listaGastos" class="space-y-2 max-h-60 overflow-y-auto text-sm">
                    <p class="text-gray-400 text-center text-xs">Carregando...</p>
                </div>
            </div>
        </div>

        <!-- Rodapé -->
        <footer class="text-center text-xs text-gray-400 py-4">
            Conectado à sua VPS com Segurança 🔒
        </footer>
    </div>

    <script>
        const API_URL = 'https://controler.gomesdev87.tech/finace/';

        // Definir a data de hoje por padrão no input
        document.getElementById('data').valueAsDate = new Date();

        // Função para buscar e listar os gastos
        async function carregarGastos() {
            try {
                const response = await fetch(API_URL);
                const gastos = await response.json();
                const listaDiv = document.getElementById('listaGastos');
                
                listaDiv.innerHTML = '';
                if (gastos.length === 0) {
                    listaDiv.innerHTML = '<p class="text-gray-400 text-center text-xs">Nenhum gasto registrado.</p>';
                    return;
                }

                gastos.forEach(g => {
                    listaDiv.innerHTML += `
                        <div class="flex justify-between items-center p-2 bg-gray-50 rounded-lg border">
                            <div>
                                <p class="font-medium text-gray-800">${g.descricao || 'Gasto'}</p>
                                <p class="text-xs text-gray-400">${g.data || ''}</p>
                            </div>
                            <span class="text-red-600 font-bold">R$ ${parseFloat(g.valor).toFixed(2)}</span>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Erro ao buscar dados:', error);
                document.getElementById('listaGastos').innerHTML = '<p class="text-red-400 text-center text-xs">Erro ao conectar à API.</p>';
            }
        }

        // Função para enviar novo gasto
        document.getElementById('gastoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const descricao = document.getElementById('descricao').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const data = document.getElementById('data').value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ descricao, valor, data })
                });

                if (response.ok) {
                    document.getElementById('gastoForm').reset();
                    document.getElementById('data').valueAsDate = new Date();
                    carregarGastos();
                } else {
                    alert('Erro ao salvar o gasto.');
                }
            } catch (error) {
                console.error('Erro ao enviar:', error);
                alert('Falha na comunicação com o servidor.');
            }
        });

        // Carregar ao iniciar
        carregarGastos();
    </script>
</body>
</html>
