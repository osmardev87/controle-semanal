<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Gastos — Pixel Art</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffd700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        pixel: ['"Press Start 2P"', 'monospace'],
                    },
                    colors: {
                        px: {
                            gold: '#ffd700',
                            goldDark: '#b8860b',
                            emerald: '#00ff7f',
                            ruby: '#ff4444',
                            blue: '#44aaff',
                            dark: '#1a1c2c',
                            darker: '#0f0f1a',
                            card: '#2a2e42',
                            cardLight: '#3a3f5c',
                            border: '#555577'
                        }
                    },
                    boxShadow: {
                        'pixel': '4px 4px 0 rgba(0,0,0,0.6)',
                        'pixel-sm': '2px 2px 0 rgba(0,0,0,0.5)',
                        'pixel-gold': '4px 4px 0 #b8860b, 0 0 0 2px #000',
                        'pixel-emerald': '4px 4px 0 #008844, 0 0 0 2px #000',
                        'pixel-ruby': '4px 4px 0 #aa2222, 0 0 0 2px #000',
                    },
                    borderWidth: {
                        'pixel': '3px',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .pixel-border {
                @apply border-pixel border-black shadow-pixel;
            }
            .pixel-border-gold {
                @apply border-pixel border-px-goldDark shadow-pixel-gold;
            }
            .pixel-border-emerald {
                @apply border-pixel border-green-600 shadow-pixel-emerald;
            }
            .pixel-border-ruby {
                @apply border-pixel border-red-700 shadow-pixel-ruby;
            }
            .pixel-card {
                @apply bg-px-card pixel-border border-px-border;
            }
            .pixel-btn {
                @apply bg-px-gold text-px-darker font-bold pixel-border-gold 
                       hover:brightness-110 active:translate-x-1 active:translate-y-1 active:shadow-none 
                       transition-all duration-100;
            }
            .pixel-btn-secondary {
                @apply bg-px-card text-white pixel-border
                       hover:bg-px-cardLight active:translate-x-1 active:translate-y-1 active:shadow-none 
                       transition-all duration-100;
            }
            .pixel-input {
                @apply bg-px-darker border-pixel border-px-border text-white
                       focus:border-px-gold focus:outline-none focus:bg-px-card transition-colors;
            }
            .pixel-text {
                text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
                letter-spacing: 0.5px;
            }
        }
        * {
            image-rendering: pixelated;
        }
        body {
            background-image: 
                linear-gradient(rgba(26, 28, 44, 0.95), rgba(15, 15, 26, 0.98)),
                repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(255,255,255,0.02) 4px, rgba(255,255,255,0.02) 8px);
        }
    </style>
</head>

<body class="bg-px-darker text-white min-h-screen">
    <!-- Cabeçalho Pixel Art -->
    <header class="bg-px-dark py-6 px-4 border-b-pixel border-black shadow-md">
        <div class="max-w-md mx-auto">
            <div class="flex items-center gap-3 mb-2">
                <span class="text-3xl">💰</span>
                <h1 class="text-xl font-bold text-px-gold pixel-text">CONTROLE DE GASTOS</h1>
            </div>
           
            <!-- Saldo -->
            <div class="mt-5 pixel-card p-5 rounded-none">
                <p class="text-px-gold/80 text-xs font-bold mb-2 uppercase tracking-wider">Saldo Atual</p>
                <p id="balance" class="text-3xl font-bold text-px-gold pixel-text">R$ 0,00</p>

                <div class="border-b border-dashed border-gray-600 my-4"></div>

                <div class="flex justify-between text-sm">
                    <div class="flex items-center gap-2">
                        <span
                            class="w-8 h-8 bg-px-emerald/20 flex items-center justify-center border-pixel border-green-600">
                            <i class="fa fa-arrow-down text-px-emerald"></i>
                        </span>
                        <div>
                            <p class="text-gray-400 text-xs">ENTRADAS</p>
                            <p id="totalIncome" class="font-bold text-px-emerald">+ R$ 0,00</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 text-right">
                        <span
                            class="w-8 h-8 bg-px-ruby/20 flex items-center justify-center border-pixel border-red-700">
                            <i class="fa fa-arrow-up text-px-ruby"></i>
                        </span>
                        <div>
                            <p class="text-gray-400 text-xs">SAÍDAS</p>
                            <p id="totalExpense" class="font-bold text-px-ruby">- R$ 0,00</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="px-4 py-5 max-w-md mx-auto">
        <!-- Abas -->
        <div class="grid grid-cols-4 gap-2 mb-6">
            <button id="tabAll" class="pixel-btn py-2 text-xs">
                TODOS
            </button>
            <button id="tabWeek" class="pixel-btn-secondary py-2 text-xs">
                SEMANA
            </button>
            <button id="tabMonth" class="pixel-btn-secondary py-2 text-xs">
                MÊS
            </button>
            <button id="tabAdd" class="pixel-btn-secondary py-2 text-xs">
                +ADD
            </button>
        </div>

        <!-- Lista de Movimentos -->
        <div id="listSection" class="space-y-3">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-bold text-base text-px-gold pixel-text">📜 MOVIMENTOS</h2>
                /* <button id="clearBtn" class="text-gray-400 text-xs hover:text-px-ruby transition-colors pixel-text">
                    [LIMPAR]
                </button> */
            </div>

            <div id="loading" class="text-center py-10 text-gray-500">
                <div class="inline-block w-6 h-6 border-pixel border-px-gold border-t-transparent animate-spin mb-2">
                </div>
                <p class="text-xs">CARREGANDO...</p>
            </div>

            <div id="emptyState" class="hidden text-center py-14 text-gray-400">
                <div class="text-5xl mb-4">📦</div>
                <p class="font-bold text-gray-300 pixel-text">NENHUM REGISTRO</p>
                <p class="text-xs mt-2 text-gray-500">Toque em <span class="text-px-gold">[+ADD]</span> para começar!
                </p>
            </div>

            <div id="itemsList" class="space-y-3"></div>
        </div>

        <!-- Formulário de Adição -->
        <div id="formSection" class="hidden">
            <h2 class="font-bold text-base mb-5 text-px-gold pixel-text">➕ NOVA MOVIMENTAÇÃO</h2>

            <form id="transactionForm" class="space-y-4">
                <!-- Tipo -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">Tipo</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="type" value="ENTRADA" class="sr-only peer">
                            <div class="pixel-card p-3 text-center transition-colors
                                        peer-checked:border-px-emerald peer-checked:bg-px-emerald/10">
                                <span class="text-px-emerald text-lg">⬇</span>
                                <span class="block mt-1 font-bold text-sm">ENTRADA</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="type" value="SAIDA" class="sr-only peer" checked>
                            <div class="pixel-card p-3 text-center transition-colors
                                        peer-checked:border-px-ruby peer-checked:bg-px-ruby/10">
                                <span class="text-px-ruby text-lg">⬆</span>
                                <span class="block mt-1 font-bold text-sm">DESPESA</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Descrição -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">Descrição</label>
                    <input type="text" id="description" name="description" class="w-full px-3 py-3 pixel-input"
                        placeholder="Ex: Supermercado..." maxlength="100" required>
                </div>

                <!-- Valor e Data -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">Valor</label>
                        <input type="number" step="0.01" min="0.01" id="price" name="price"
                            class="w-full px-3 py-3 pixel-input" placeholder="0,00" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">Data</label>
                        <input type="date" id="date" name="date" class="w-full px-3 py-3 pixel-input" required>
                    </div>
                </div>

                <!-- Categoria -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">Categoria</label>
                    <select id="category" name="category" class="w-full px-3 py-3 pixel-input" required>
                        <option value="">Selecione...</option>
                        <option value="ALIMENTACAO">🍔 Comida</option>
                        <option value="TRANSPORTE">🚗 Carro</option>
                        <option value="LAZER">🎮 Diversão</option>
                        <option value="MORADIA">🏠 Casa</option>
                        <option value="SAUDE">💊 Saúde</option>
                        <option value="EDUCACAO">📚 Estudo</option>
                        <option value="SALARIO">💰 Salário</option>
                        <option value="OUTROS">📝 Outros</option>
                    </select>
                </div>

                <!-- Forma de Pagamento -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">Pagamento</label>
                    <select id="payment" name="payment" class="w-full px-3 py-3 pixel-input" required>
                        <option value="">Selecione...</option>
                        <option value="DINHEIRO">💵 Dinheiro</option>
                        <option value="PIX">⚡ PIX</option>
                        <option value="CREDITO">💳 Crédito</option>
                        <option value="DEBITO">💳 Débito</option>
                        <option value="TRANSFERENCIA">🏦 Transf.</option>
                        <option value="OUTROS">📝 Outros</option>
                    </select>
                </div>

                <!-- Botões -->
                <div class="flex gap-3 pt-2">
                    <button type="button" id="cancelBtn" class="flex-1 py-3 pixel-btn-secondary">
                        CANCELAR
                    </button>
                    <button type="submit" class="flex-1 py-3 pixel-btn">
                        SALVAR
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Toast de Notificação -->
    <div id="toast"
        class="fixed bottom-6 left-4 right-4 max-w-md mx-auto bg-px-card text-white py-3 px-4 pixel-border-gold transform translate-y-20 opacity-0 transition-all duration-200 pointer-events-none z-50 text-center font-bold">
    </div>

    <script>
        const API_BASE = "https://controler.gomesdev87.tech/finace";

        const tabAll = document.getElementById('tabAll');
        const tabWeek = document.getElementById('tabWeek');
        const tabMonth = document.getElementById('tabMonth');
        const tabAdd = document.getElementById('tabAdd');
        const listSection = document.getElementById('listSection');
        const formSection = document.getElementById('formSection');
        const itemsList = document.getElementById('itemsList');
        const loading = document.getElementById('loading');
        const emptyState = document.getElementById('emptyState');
        const form = document.getElementById('transactionForm');
        const cancelBtn = document.getElementById('cancelBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toast = document.getElementById('toast');

        document.getElementById('date').valueAsDate = new Date();
        let currentFilter = 'all';

        function setActiveTab(activeTab) {
            [tabAll, tabWeek, tabMonth, tabAdd].forEach(tab => {
                tab.classList.remove('pixel-btn');
                tab.classList.add('pixel-btn-secondary');
            });
            activeTab.classList.remove('pixel-btn-secondary');
            activeTab.classList.add('pixel-btn');

            if (activeTab === tabAdd) {
                listSection.classList.add('hidden');
                formSection.classList.remove('hidden');
            } else {
                listSection.classList.remove('hidden');
                formSection.classList.add('hidden');
                currentFilter = activeTab === tabAll ? 'all' : activeTab === tabWeek ? 'week' : 'month';
                loadData(currentFilter);
            }
        }

        tabAll.addEventListener('click', () => setActiveTab(tabAll));
        tabWeek.addEventListener('click', () => setActiveTab(tabWeek));
        tabMonth.addEventListener('click', () => setActiveTab(tabMonth));
        tabAdd.addEventListener('click', () => setActiveTab(tabAdd));
        cancelBtn.addEventListener('click', () => setActiveTab(tabAll));

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
        }

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.style.borderColor = isError ? '#ff4444' : '#ffd700';
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        async function loadData(filterType = 'all') {
            loading.classList.remove('hidden');
            emptyState.classList.add('hidden');
            itemsList.innerHTML = '';

            try {
                let url = API_BASE + '/';
                if (filterType === 'week') {
                    const t = new Date();
                    const d = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
                    url = `${API_BASE}/semana/${d}`;
                } else if (filterType === 'month') {
                    const t = new Date();
                    const am = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}`;
                    url = `${API_BASE}/mes/${am}`;
                }

                const res = await fetch(url);
                if (!res.ok) throw new Error('Erro na conexão');
                const data = await res.json();

                loading.classList.add('hidden');
                if (!data.length) { emptyState.classList.remove('hidden'); updateBalance([]); return; }

                renderItems(data);
                updateBalance(data);
            } catch (err) {
                loading.classList.add('hidden');
                showToast('ERRO: ' + err.message, true);
            }
        }

        function renderItems(items) {
            itemsList.innerHTML = '';
            items.forEach(item => {
                const isIncome = String(item.type).toUpperCase().trim() === 'ENTRADA';
                const card = document.createElement('div');
                card.className = `pixel-card border-l-4 ${isIncome ? 'border-l-px-emerald' : 'border-l-px-ruby'}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start p-3 gap-3">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-sm pixel-text">${item.description}</h3>
                            <p class="text-xs text-gray-400 mt-1">${(item.category || '').replace('_', ' ')} • ${formatDate(item.date)}</p>
                            <p class="text-xs text-gray-500 mt-0.5">${(item.payment || '').replace('_', ' ')}</p>
                        </div>
                        <p class="font-bold whitespace-nowrap ${isIncome ? 'text-px-emerald' : 'text-px-ruby'}">
                            ${isIncome ? '+' : '-'}${formatCurrency(item.price)}
                        </p>
                    </div>
                `;
                itemsList.appendChild(card);
            });
        }

        function updateBalance(items) {
            let income = 0, expense = 0;
            items.forEach(i => {
                const v = Number(i.price) || 0;
                String(i.type).toUpperCase().trim() === 'ENTRADA' ? income += v : expense += v;
            });
            document.getElementById('balance').textContent = formatCurrency(income - expense);
            document.getElementById('totalIncome').textContent = '+' + formatCurrency(income);
            document.getElementById('totalExpense').textContent = '-' + formatCurrency(expense);
        }

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const d = {
                description: form.description.value,
                price: parseFloat(form.price.value),
                date: form.date.value,
                type: form.type.value,
                category: form.category.value,
                payment: form.payment.value
            };
            try {
                const res = await fetch(API_BASE + '/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(d)
                });
                if (!res.ok) throw await res.json().then(j => j.message || 'Erro ao salvar');
                form.reset();
                document.getElementById('date').valueAsDate = new Date();
                showToast('✅ SALVO!');
                setActiveTab(tabAll);
            } catch (err) {
                showToast('❌ ' + err, true);
            }
        });

        clearBtn.addEventListener('click', async () => {
            if (!confirm('Apagar TUDO? Não tem volta!')) return;
            await fetch(API_BASE + '/', { method: 'DELETE' });
            showToast('🗑️ LIMPO!');
            loadData();
        });

        loadData('all');
    </script>
</body>

</html>
