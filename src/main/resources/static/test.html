<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Semanal e Mensal de Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rpg: {
                            gold: '#f59e0b',
                            goldLight: '#fde68a',
                            goldDark: '#b45309',
                            emerald: '#10b981',
                            ruby: '#ef4444',
                            sapphire: '#3b82f6',
                            dark: '#0f172a',
                            darker: '#070b14',
                            card: '#1e293b',
                            cardLight: '#334155'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        rpg: ['Cinzel', 'Georgia', 'serif']
                    },
                    boxShadow: {
                        'rpg-card': '0 0 0 1px rgba(245, 158, 11, 0.2), 0 4px 20px rgba(0, 0, 0, 0.35)',
                        'rpg-card-hover': '0 0 0 2px rgba(245, 158, 11, 0.4), 0 8px 30px rgba(0, 0, 0, 0.45)',
                        'rpg-glow': '0 0 20px rgba(245, 158, 11, 0.35)'
                    },
                    borderRadius: {
                        'rpg': '0.75rem',
                        'rpg-lg': '1rem',
                        'rpg-xl': '1.25rem'
                    },
                    spacing: {
                        'card-item': '1.125rem',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .rpg-card {
                @apply bg-rpg-card border border-rpg-gold/20 rounded-rpg-lg shadow-rpg-card transition-all duration-300 hover:shadow-rpg-card-hover hover:-translate-y-0.5;
            }
            .rpg-card-item {
                @apply bg-rpg-card border border-rpg-gold/20 rounded-rpg-lg shadow-rpg-card transition-all duration-300 hover:shadow-rpg-card-hover py-card-item px-4;
            }
            .rpg-btn {
                @apply bg-gradient-to-b from-rpg-gold to-rpg-goldDark text-white font-semibold rounded-rpg-lg shadow-md hover:shadow-rpg-glow active:scale-95 transition-all duration-200;
            }
            .rpg-btn-secondary {
                @apply bg-rpg-card border border-rpg-gold/30 text-rpg-gold font-medium rounded-rpg-lg hover:bg-rpg-cardLight active:scale-95 transition-all duration-200;
            }
            .rpg-input {
                @apply bg-rpg-darker border border-rpg-gold/30 text-white placeholder-gray-400 rounded-rpg-lg focus:border-rpg-gold focus:ring-2 focus:ring-rpg-gold/20 outline-none transition-all duration-200;
            }
            .rpg-tab {
                @apply py-2.5 rounded-rpg-lg text-center font-medium transition-all duration-200 text-sm;
            }
            .rpg-tab-active {
                @apply bg-gradient-to-b from-rpg-gold to-rpg-goldDark text-white shadow-rpg-glow;
            }
            .rpg-tab-inactive {
                @apply text-gray-400 hover:text-white hover:bg-rpg-card;
            }
            .rpg-header {
                background: radial-gradient(circle at top left, rgba(245, 158, 11, 0.14), transparent 35%),
                            linear-gradient(135deg, #0f172a 0%, #070b14 100%);
            }
            .rpg-text-shadow {
                text-shadow: 0 0 8px rgba(245, 158, 11, 0.45);
            }
            .rpg-divider {
                background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.5), transparent);
            }
        }
    </style>
</head>
<body class="bg-rpg-darker text-white min-h-screen">
    <!-- Cabeçalho RPG -->
    <header class="rpg-header py-8 px-5 rounded-b-rpg-xl shadow-xl">
        <div class="max-w-md mx-auto">
            <div class="flex items-center gap-3 mb-1">
                <i class="fa fa-diamond text-rpg-gold text-2xl rpg-text-shadow"></i>
                <h1 class="text-[clamp(1.5rem,4vw,1.8rem)] font-bold text-rpg-gold rpg-text-shadow">Controle de Gastos</h1>
            </div>
            <p class="text-gray-300 text-sm">Gerencie seus gastos como um verdadeiro aventureiro</p>

            <!-- Saldo -->
            <div class="mt-6 rpg-card p-5">
                <div class="flex items-center gap-2 mb-3">
                    <i class="fa fa-coins text-rpg-gold"></i>
                    <p class="text-rpg-gold/80 text-sm font-medium" id="balanceLabel">Saldo Atual</p>
                </div>
                <p id="balance" class="text-3xl font-bold text-rpg-gold tracking-tight rpg-text-shadow">R$ 0,00</p>

                <div class="rpg-divider h-px my-4"></div>

                <div class="flex justify-between text-sm">
                    <div class="flex items-center gap-2">
                        <span class="w-9 h-9 rounded-full bg-rpg-emerald/20 flex items-center justify-center border border-rpg-emerald/30">
                            <i class="fa fa-arrow-down text-rpg-emerald"></i>
                        </span>
                        <div>
                            <p class="text-gray-400 text-xs">Entradas</p>
                            <p id="totalIncome" class="font-semibold text-rpg-emerald">+ R$ 0,00</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 text-right">
                        <span class="w-9 h-9 rounded-full bg-rpg-ruby/20 flex items-center justify-center border border-rpg-ruby/30">
                            <i class="fa fa-arrow-up text-rpg-ruby"></i>
                        </span>
                        <div>
                            <p class="text-gray-400 text-xs">Saídas</p>
                            <p id="totalExpense" class="font-semibold text-rpg-ruby">- R$ 0,00</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="px-4 py-6 max-w-md mx-auto">
        <!-- Abas -->
        <div class="grid grid-cols-4 gap-2 mb-6 bg-rpg-darker rounded-rpg-xl p-1.5 border border-rpg-gold/20">
            <button id="tabAll" class="rpg-tab rpg-tab-active px-1">
                <i class="fa fa-list"></i> Todos
            </button>
            <button id="tabWeek" class="rpg-tab rpg-tab-inactive px-1">
                <i class="fa fa-calendar"></i> Semana
            </button>
            <button id="tabMonth" class="rpg-tab rpg-tab-inactive px-1">
                <i class="fa fa-calendar-check-o"></i> Mês
            </button>
            <button id="tabAdd" class="rpg-tab rpg-tab-inactive px-1">
                <i class="fa fa-plus"></i> Add
            </button>
        </div>

        <!-- Lista de Movimentos -->
        <div id="listSection" class="space-y-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-lg text-rpg-gold flex items-center gap-2" id="listTitle">
                    <i class="fa fa-scroll"></i> Movimentações
                </h2>
                <button id="clearBtn" class="text-gray-400 text-sm hover:text-rpg-ruby transition-colors">
                    Limpar
                </button>
            </div>

            <div id="loading" class="text-center py-12 text-gray-500">
                <i class="fa fa-spinner fa-spin mr-2 text-rpg-gold text-lg"></i> Carregando...
            </div>

            <div id="emptyState" class="hidden text-center py-16 text-gray-400">
                <div class="w-24 h-24 mx-auto mb-4 rounded-full bg-rpg-card flex items-center justify-center border border-rpg-gold/20">
                    <i class="fa fa-credit-card text-3xl text-rpg-gold/40"></i>
                </div>
                <p class="font-medium text-gray-300">Nenhuma movimentação registrada</p>
                <p class="text-sm mt-1 text-gray-400">Toque em <span class="font-medium text-rpg-gold">"Add"</span> para começar</p>
            </div>

            <div id="itemsList" class="space-y-3.5"></div>
        </div>

        <!-- Formulário de Adição -->
        <div id="formSection" class="hidden">
            <h2 class="font-semibold text-lg mb-5 text-rpg-gold flex items-center gap-2">
                <i class="fa fa-plus-circle"></i> Nova Movimentação
            </h2>

            <form id="transactionForm" class="space-y-5">
                <!-- Tipo -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-3">Tipo de Movimento</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="type" value="RECEITA" class="sr-only peer">
                            <div class="rpg-card p-4 text-center transition-all duration-200 
                                        peer-checked:border-rpg-emerald peer-checked:shadow-rpg-card-hover">
                                <i class="fa fa-arrow-down text-rpg-emerald text-lg"></i>
                                <span class="block mt-2 font-medium text-white">Receita</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="type" value="DESPESA" class="sr-only peer" checked>
                            <div class="rpg-card p-4 text-center transition-all duration-200 
                                        peer-checked:border-rpg-ruby peer-checked:shadow-rpg-card-hover">
                                <i class="fa fa-arrow-up text-rpg-ruby text-lg"></i>
                                <span class="block mt-2 font-medium text-white">Despesa</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Descrição -->
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-300 mb-1.5">Descrição</label>
                    <input type="text" id="description" name="description"
                        class="w-full px-4 py-3.5 rpg-input"
                        placeholder="Ex: Salário, Supermercado..." maxlength="100" required>
                </div>

                <!-- Valor e Data -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="price" class="block text-sm font-medium text-gray-300 mb-1.5">Valor</label>
                        <input type="number" step="0.01" min="0.01" id="price" name="price"
                            class="w-full px-4 py-3.5 rpg-input"
                            placeholder="0,00" required>
                    </div>
                    <div>
                        <label for="date" class="block text-sm font-medium text-gray-300 mb-1.5">Data</label>
                        <input type="date" id="date" name="date"
                            class="w-full px-4 py-3.5 rpg-input" required>
                    </div>
                </div>

                <!-- Categoria -->
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-300 mb-1.5">Categoria</label>
                    <select id="category" name="category" class="w-full px-4 py-3.5 rpg-input" required>
                        <option value="">Selecione...</option>
                        <option value="ALIMENTACAO">🍔 Alimentação</option>
                        <option value="TRANSPORTE">🚗 Transporte</option>
                        <option value="LAZER">🎮 Lazer</option>
                        <option value="MORADIA">🏠 Moradia</option>
                        <option value="SAUDE">💊 Saúde</option>
                        <option value="EDUCACAO">📚 Educação</option>
                        <option value="SALARIO">💰 Salário</option>
                        <option value="OUTROS">📝 Outros</option>
                    </select>
                </div>

                <!-- Forma de Pagamento -->
                <div>
                    <label for="payment" class="block text-sm font-medium text-gray-300 mb-1.5">Forma de Pagamento</label>
                    <select id="payment" name="payment" class="w-full px-4 py-3.5 rpg-input" required>
                        <option value="">Selecione...</option>
                        <option value="DINHEIRO">💵 Dinheiro</option>
                        <option value="PIX">⚡ PIX</option>
                        <option value="CARTAO_CREDITO">💳 Cartão de Crédito</option>
                        <option value="CARTAO_DEBITO">💳 Cartão de Débito</option>
                        <option value="TRANSFERENCIA">🏦 Transferência</option>
                    </select>
                </div>

                <!-- Botões -->
                <div class="flex gap-3 pt-3">
                    <button type="button" id="cancelBtn" class="flex-1 py-3.5 rpg-btn-secondary">
                        Cancelar
                    </button>
                    <button type="submit" class="flex-1 py-3.5 rpg-btn">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Toast de Notificação -->
    <div id="toast"
        class="fixed bottom-6 left-4 right-4 max-w-md mx-auto bg-rpg-card text-white py-3.5 px-5 rounded-rpg-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50 border border-rpg-gold/30">
    </div>

    <script>
        const API_BASE = "https://controler.gomesdev87.tech/finace";

        const tabAll = document.getElementById('tabAll');
        const tabWeek = document.getElementById('tabWeek');
        const tabMonth = document.getElementById('tabMonth');
        const tabAdd = document.getElementById('tabAdd');
        const listSection = document.getElementById('listSection');
        const formSection = document.getElementById('formSection');
        const itemsList = document.getElementById('itemsList');
        const loading = document.getElementById('loading');
        const emptyState = document.getElementById('emptyState');
        const form = document.getElementById('transactionForm');
        const cancelBtn = document.getElementById('cancelBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toast = document.getElementById('toast');
        const balanceLabel = document.getElementById('balanceLabel');
        const listTitle = document.getElementById('listTitle');

        document.getElementById('date').valueAsDate = new Date();

        // Tipo de filtro atual
        let currentFilter = 'all'; // 'all' | 'week' | 'month'

        function setActiveTab(activeTab) {
            [tabAll, tabWeek, tabMonth, tabAdd].forEach(tab => {
                tab.classList.remove('rpg-tab-active');
                tab.classList.add('rpg-tab-inactive');
            });
            activeTab.classList.add('rpg-tab-active');
            activeTab.classList.remove('rpg-tab-inactive');

            if (activeTab === tabAdd) {
                listSection.classList.add('hidden');
                formSection.classList.remove('hidden');
            } else {
                listSection.classList.remove('hidden');
                formSection.classList.add('hidden');
                
                // Define o tipo de filtro e atualiza os rótulos
                if (activeTab === tabAll) {
                    currentFilter = 'all';
                    balanceLabel.textContent = 'Saldo Total';
                    listTitle.innerHTML = '<i class="fa fa-scroll"></i> Todas as Movimentações';
                } else if (activeTab === tabWeek) {
                    currentFilter = 'week';
                    balanceLabel.textContent = 'Saldo da Semana';
                    listTitle.innerHTML = '<i class="fa fa-calendar"></i> Movimentações da Semana';
                } else if (activeTab === tabMonth) {
                    currentFilter = 'month';
                    balanceLabel.textContent = 'Saldo do Mês';
                    listTitle.innerHTML = '<i class="fa fa-calendar-check-o"></i> Movimentações do Mês';
                }
                
                loadData(currentFilter);
            }
        }

        tabAll.addEventListener('click', () => setActiveTab(tabAll));
        tabWeek.addEventListener('click', () => setActiveTab(tabWeek));
        tabMonth.addEventListener('click', () => setActiveTab(tabMonth));
        tabAdd.addEventListener('click', () => setActiveTab(tabAdd));
        cancelBtn.addEventListener('click', () => setActiveTab(tabAll));

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value || 0);
        }

        function formatDate(dateStr) {
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.style.borderColor = isError ? 'rgba(239, 68, 68, 0.5)' : 'rgba(245, 158, 11, 0.5)';
            toast.style.backgroundColor = isError ? 'rgba(239, 68, 68, 0.15)' : '#1e293b';
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        async function loadData(filterType = 'all') {
            loading.classList.remove('hidden');
            emptyState.classList.add('hidden');
            itemsList.innerHTML = '';

            try {
                let url = API_BASE + '/';
                
                if (filterType === 'week') {
                    const today = new Date();
                    url = `${API_BASE}/semana/${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                } else if (filterType === 'month') {
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = String(today.getMonth() + 1).padStart(2, '0');
                    url = `${API_BASE}/mes/${year}-${month}`;
                }
                // filterType === 'all' usa a URL padrão

                const res = await fetch(url);
                if (!res.ok) throw new Error('Erro ao buscar dados');

                const data = await res.json();
                loading.classList.add('hidden');

                if (data.length === 0) {
                    emptyState.classList.remove('hidden');
                    updateBalance([]);
                    return;
                }

                renderItems(data);
                updateBalance(data);
            } catch (err) {
                loading.classList.add('hidden');
                showToast('Erro ao conectar com a API: ' + err.message, true);
                console.error(err);
            }
        }

        function renderItems(items) {
            itemsList.innerHTML = '';
            items.forEach(item => {
                const tipo = String(item.type).toUpperCase().trim();
                const isIncome = tipo === 'RECEITA' || tipo === 'ENTRADA';

                const card = document.createElement('div');
                card.className = `rpg-card-item border-l-4 ${isIncome ? 'border-rpg-emerald' : 'border-rpg-ruby'}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-semibold text-white text-base">${item.description}</h3>
                            <p class="text-sm text-gray-400 mt-1.5">${(item.category || '').replace('_', ' ')} • ${formatDate(item.date)}</p>
                            <p class="text-xs text-gray-500 mt-1">${(item.payment || '').replace('_', ' ')}</p>
                        </div>
                        <p class="font-bold text-lg whitespace-nowrap ${isIncome ? 'text-rpg-emerald' : 'text-rpg-ruby'}">
                            ${isIncome ? '+' : '-'} ${formatCurrency(item.price)}
                        </p>
                    </div>
                `;
                itemsList.appendChild(card);
            });
        }

        function updateBalance(items) {
            let income = 0, expense = 0;
            items.forEach(item => {
                const value = Number(item.price) || 0;
                const tipo = String(item.type).toUpperCase().trim();
                const isIncome = tipo === 'RECEITA' || tipo === 'ENTRADA';
                if (isIncome) income += value;
                else expense += value;
            });

            document.getElementById('balance').textContent = formatCurrency(income - expense);
            document.getElementById('totalIncome').textContent = '+ ' + formatCurrency(income);
            document.getElementById('totalExpense').textContent = '- ' + formatCurrency(expense);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = {
                description: formData.get('description'),
                price: parseFloat(formData.get('price')),
                date: formData.get('date'),
                type: formData.get('type'),
                category: formData.get('category'),
                payment: formData.get('payment')
            };

            try {
                const res = await fetch(API_BASE + '/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Erro ao salvar');
                }

                form.reset();
                document.getElementById('date').valueAsDate = new Date();
                showToast('✅ Movimentação cadastrada com sucesso!');
                setActiveTab(tabAll);
            } catch (err) {
                showToast('❌ Erro: ' + err.message, true);
            }
        });

        clearBtn.addEventListener('click', async () => {
            if (!confirm('Tem certeza que deseja apagar TODOS os registros? Esta ação não pode ser desfeita.')) return;

            try {
                await fetch(API_BASE + '/', { method: 'DELETE' });
                showToast('🗑️ Banco de dados limpo!');
                if (currentFilter === 'all') loadData();
                else setActiveTab(tabAll);
            } catch (err) {
                showToast('Erro ao limpar: ' + err.message, true);
            }
        });

        loadData('all');
    </script>
</body>
</html>
